<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashikur Rahman Digital Printing &amp; Packaging</title>
<meta name="description" content="Banners, posters, leaflets, stickers and packaging printed to order in Dhaka.">
<link rel="icon" id="fav" href="uploads/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@700;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top"><div class="wrap" id="top"></div></div>
<header class="hd"><div class="wrap">
<a class="logo" href="#home" id="logo"></a>
<button class="burger" aria-label="Menu" aria-expanded="false">Menu</button>
<nav id="nav" aria-label="Main"><a href="#home">Home</a><a href="#products">Products</a><a href="#about">About</a><a href="#blog">Blog</a><a href="#contact">Contact</a><span id="auth"></span></nav>
</div></header>
<main>
<section class="hero" id="home"><div class="slides" id="slides"></div><div class="dots" id="dots"></div><div class="crop"></div></section>
<section class="sec" id="products"><div class="wrap"><h2>Our products</h2>
<div class="bar"><div class="chips" id="chips"></div><input id="q" type="search" placeholder="Search products" aria-label="Search products"></div>
<div class="g3" id="grid"></div></div></section>
<section class="sec dk" id="about"><div class="wrap two"><div><h2>About us</h2><p class="pre" id="about-t"></p></div>
<ul class="why"><li>Fast turnaround</li><li>Sharp colour output</li><li>Custom design help</li><li>Bulk order pricing</li></ul></div></section>
<section class="sec lt" id="blog"><div class="wrap"><h2>From the blog</h2><div class="g3" id="posts"></div></div></section>
<section class="sec" id="contact"><div class="wrap"><h2>Contact us</h2><div class="cgrid" id="cinfo"></div><div id="map"></div></div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="fab" id="fab"></div>
<div id="toast" role="status"></div>
<dialog id="dlg"><button class="x" data-do="x" aria-label="Close">×</button><div id="dbody"></div></dialog>
<script src="app.js"></script>
</body>
</html>
